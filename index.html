<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💜</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>

  <main class="card">
    <header class="card-header">
      <h1 id="title">Will you be my Valentine? 💜</h1>
    </header>

    <section class="card-bunny">
      <div class="bunny">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
        </div>
        <div class="tulip">
          <div class="flower"></div>
          <div class="stem"></div>
        </div>
      </div>
    </section>

    <section class="card-actions">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 💔</button>
    </section>
  </main>

  <!-- Envelope Popup -->
  <div class="envelope-container" id="envelopeContainer" aria-hidden="true">
    <div class="envelope" id="envelope">
      <div class="flap">
        <div class="flap-heart"></div>
      </div>
      <div class="letter">
        <div class="paper">
          <span class="paper-heart tl">❤</span>
          <span class="paper-heart br">❤</span>
          <div class="paper-lines"></div>
          <p class="message">see youuuu on fridayyy myloveee! 💜</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
